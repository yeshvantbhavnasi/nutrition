name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  food-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval
      - name: Seed file is up to date
        run: npm run seed:sql -w @thali/food-db && git diff --exit-code packages/food-db/db/seed.sql
      - name: Schema and seed load into Postgres
        run: psql -v ON_ERROR_STOP=1 -f packages/food-db/db/schema.sql -f packages/food-db/db/seed.sql
